schema_version: demo-story.redhat-intel.com/story-brief/v1
title: "Northstar Claims: one trusted node is not a qualified fleet"
audience: "Security, platform, AI, and risk teams preparing a confidential AI fleet for independent certification."
desired_outcome: "Continue the Sovereign AI 401 journey by proving that Northstar Claims can qualify its claims-assistant fleet across rollout, freshness, revocation, dependencies, concurrency, and evidence correlation without transferring human authority."
duration_minutes: 7
presentation_scenes: 7
lab_duration_minutes: 85
claims:
  - {id: fleet-baseline, class: rehearsal-fixture, treatment: "REHEARSAL control-flow proof; never LIVE capacity or TDX proof"}
  - {id: fail-closed, class: verified-fact, treatment: "Supported by contract tests"}
  - {id: live-tdx, class: future-state, treatment: "Blocked until direct observation"}
  - {id: promotion, class: verified-fact, treatment: "Human-only; every factory authority flag false"}
beats:
  - {id: ordinary_world, claim: "A fleet can pass node by node and still fail as a system."}
  - {id: stakes, claim: "Version skew, stale quotes, revocation lag, partitions, and saturation create fleet-level trust gaps."}
  - {id: reframe, claim: "Qualify the envelope under controlled change—not the happy path in isolation."}
  - {id: system_reveal, claim: "Node evidence, policy rollout, dependencies, admission, and authority feed one correlated receipt."}
  - {id: live_proof, claim: "Run baseline and changed conditions through the same REHEARSAL path."}
  - {id: trials, claim: "Every unsafe condition refuses promotion and exposes the exact reason."}
  - {id: payoff, claim: "An immutable candidate can be review-ready while certification and promotion remain false."}
  - {id: next_journey, claim: "Continue into the separate 75–90 minute Showroom lab; stop before Launchpad."}
